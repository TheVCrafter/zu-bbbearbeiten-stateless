name: Remove new issue label

on:
  issues:
    types: [assigned]

permissions:
  issues: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove new issue label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: "status: new issue"
